title = "RONSAS gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [rules.allowlist]
  description = "Known non-secret client identifiers: browser preference key and Supabase publishable client key passed to local CI preview"
  regexTarget = "line"
  regexes = [
    '''PREFS_STORAGE_KEY\s*=\s*"ci-health\.prefs\.v1"''',
    '''--var\s+SUPABASE_PUBLISHABLE_KEY:sb_publishable_[A-Za-z0-9_-]+'''
  ]
