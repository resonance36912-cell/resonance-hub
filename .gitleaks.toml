title = "Resonance Hub gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[rules.allowlist]
description = "Known non-secret client identifiers"
regexTarget = "line"
regexes = [
  '''(?i)^\s*(?:VITE_)?SUPABASE_PUBLISHABLE_KEY\s*=\s*["']?sb_publishable_[A-Za-z0-9_-]+["']?\s*$''',
  '''--var\s+SUPABASE_PUBLISHABLE_KEY:sb_publishable_[A-Za-z0-9_-]+''',
  '''^\s*const\s+PREFS_STORAGE_KEY\s*=\s*["']ci-health\.prefs\.v1["'];?\s*$'''
]
