name: One-shot format Hub hardening files 2026-09-21

on:
  push:
    branches:
      - ronsas/security-ci-hardening-20260921
    paths:
      - ".github/workflows/format-security-hardening-20260921.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: ronsas/security-ci-hardening-20260921
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Format changed TypeScript and workflow files
        run: |
          bunx prettier --write \
            scripts/annotate-sarif.ts \
            scripts/summarize-sarif.ts \
            scripts/lib/summary-history.ts \
            scripts/lib/summary-history.test.ts \
            .github/workflows/codeql.yml
          bunx eslint --max-warnings=0 \
            scripts/annotate-sarif.ts \
            scripts/summarize-sarif.ts \
            scripts/lib/summary-history.ts \
            scripts/lib/summary-history.test.ts

      - name: Commit formatting if needed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/annotate-sarif.ts \
            scripts/summarize-sarif.ts \
            scripts/lib/summary-history.ts \
            scripts/lib/summary-history.test.ts \
            .github/workflows/codeql.yml
          git commit -m "style(ci): format hardening changes"
          git push origin HEAD:ronsas/security-ci-hardening-20260921
