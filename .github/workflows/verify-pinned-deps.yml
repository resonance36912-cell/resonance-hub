name: Verify pinned dependencies

# Fails the build unless every entry in package.json is pinned to an exact
# version AND bun.lock resolves to that same exact version. Guards against
# caret/tilde ranges and package.json ↔ lockfile drift.
#
# Runs on EVERY pull request (no `paths:` filter) so it can be a required
# status check: a path-filtered job never reports on unrelated PRs, which
# leaves a required check stuck "Expected" and blocks merges forever.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow re-running on demand after fixing pins locally.
  workflow_dispatch:

# One run per PR/branch; a new push cancels the stale run.
concurrency:
  group: verify-pinned-deps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Enforce exact-version pins (package.json + bun.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Single wrapper = the same gate the production prebuild runs:
      #   1. bun install --frozen-lockfile  (stale lockfile fails fast)
      #   2. scripts/verify-pinned-deps.ts  (exact pins + lock agreement)
      #   3. scripts/verify-lockfile-consistency.ts (overrides ↔ lock)
      # On failure it prints the remediation block, so the PR author sees the
      # exact commands to run instead of raw script output.
      - name: Verify dependency pins match bun.lock
        run: bun run scripts/verify-deps-pinned.ts

      - name: Explain how to fix drift
        if: failure()
        run: |
          {
            echo "## Dependency pin check failed"
            echo
            echo "\`package.json\` and \`bun.lock\` disagree, or a dependency uses a range (\`^\`, \`~\`, \`>=\`, \`*\`, \`latest\`)."
            echo
            echo "Fix locally, then push both files in one commit:"
            echo
            echo '```bash'
            echo "# 1. replace any ^x.y.z / ~x.y.z in package.json with the exact version"
            echo "bun run scripts/sync-overrides-from-lock.ts"
            echo "bun install"
            echo "bun run scripts/verify-deps-pinned.ts"
            echo '```'
            echo
            echo "Commit **both** \`package.json\` and \`bun.lock\` together."
          } >> "$GITHUB_STEP_SUMMARY"
