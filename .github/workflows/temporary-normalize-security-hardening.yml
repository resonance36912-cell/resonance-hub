name: Temporary normalize security hardening

on:
  push:
    branches: [ronsas/security-hardening-current-main-20260922]
    paths:
      - .github/workflows/temporary-normalize-security-hardening.yml
      - src/components/VisitTracker.tsx
      - src/lib/datanest/redaction.ts
      - src/lib/nova/orchestration.ts
      - src/lib/rons-control.functions.ts
      - src/routes/api/public/generate/creative-studio/poster.ts
      - src/routes/api/public/rop/cron/cross-app-scan.ts
      - src/routes/lovable/email/transactional/preview.ts

permissions:
  contents: write

concurrency:
  group: temporary-normalize-security-hardening
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fix only security-hardening TypeScript changes
        run: |
          bun x eslint --fix --max-warnings=0             src/components/VisitTracker.tsx             src/lib/datanest/redaction.ts             src/lib/nova/orchestration.ts             src/lib/rons-control.functions.ts             src/routes/api/public/generate/creative-studio/poster.ts             src/routes/api/public/rop/cron/cross-app-scan.ts             src/routes/lovable/email/transactional/preview.ts
          bun x eslint --max-warnings=0             src/components/VisitTracker.tsx             src/lib/datanest/redaction.ts             src/lib/nova/orchestration.ts             src/lib/rons-control.functions.ts             src/routes/api/public/generate/creative-studio/poster.ts             src/routes/api/public/rop/cron/cross-app-scan.ts             src/routes/lovable/email/transactional/preview.ts
          git diff --check
      - name: Commit formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git add --             src/components/VisitTracker.tsx             src/lib/datanest/redaction.ts             src/lib/nova/orchestration.ts             src/lib/rons-control.functions.ts             src/routes/api/public/generate/creative-studio/poster.ts             src/routes/api/public/rop/cron/cross-app-scan.ts             src/routes/lovable/email/transactional/preview.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize security hardening changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
