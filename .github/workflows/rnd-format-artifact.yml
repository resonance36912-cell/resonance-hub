name: R&D formatter artifact

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/admin.index.tsx"
      - "src/routes/admin.rnd.tsx"
      - "src/lib/rnd-control.core.ts"
      - "src/lib/rnd-control.functions.ts"
      - ".github/workflows/rnd-format-artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format R&D files
        run: |
          bunx prettier --write src/routes/admin.index.tsx src/routes/admin.rnd.tsx src/lib/rnd-control.core.ts src/lib/rnd-control.functions.ts
          bunx eslint --fix src/routes/admin.index.tsx src/routes/admin.rnd.tsx src/lib/rnd-control.core.ts src/lib/rnd-control.functions.ts || true
          bunx prettier --write src/routes/admin.index.tsx src/routes/admin.rnd.tsx src/lib/rnd-control.core.ts src/lib/rnd-control.functions.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rnd-formatted-${{ github.event.pull_request.head.sha }}
          path: |
            src/routes/admin.index.tsx
            src/routes/admin.rnd.tsx
            src/lib/rnd-control.core.ts
            src/lib/rnd-control.functions.ts
          retention-days: 1
