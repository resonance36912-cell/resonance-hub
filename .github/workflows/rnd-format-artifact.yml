name: R&D formatter artifact

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/lib/rnd-control-security.test.ts"
      - "src/routes/admin.index.tsx"
      - "src/routes/admin.rnd.tsx"
      - "src/lib/rnd-control.core.ts"
      - "src/lib/rnd-control.functions.ts"
      - ".github/workflows/rnd-format-artifact.yml"

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format R&D files
        run: |
          bunx prettier --write scripts/lib/rnd-control-security.test.ts src/routes/admin.index.tsx src/routes/admin.rnd.tsx src/lib/rnd-control.core.ts src/lib/rnd-control.functions.ts
          bunx eslint --fix scripts/lib/rnd-control-security.test.ts src/routes/admin.index.tsx src/routes/admin.rnd.tsx src/lib/rnd-control.core.ts src/lib/rnd-control.functions.ts || true
          bunx prettier --write scripts/lib/rnd-control-security.test.ts src/routes/admin.index.tsx src/routes/admin.rnd.tsx src/lib/rnd-control.core.ts src/lib/rnd-control.functions.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rnd-formatted
          path: |
            scripts/lib/rnd-control-security.test.ts
            src/routes/admin.index.tsx
            src/routes/admin.rnd.tsx
            src/lib/rnd-control.core.ts
            src/lib/rnd-control.functions.ts
          retention-days: 1

  publish:
    needs: format
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download formatted artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rnd-formatted
          path: formatted
      - name: Apply formatter output only
        shell: bash
        run: |
          set -euo pipefail
          cp formatted/scripts/lib/rnd-control-security.test.ts scripts/lib/rnd-control-security.test.ts
          cp formatted/src/routes/admin.index.tsx src/routes/admin.index.tsx
          cp formatted/src/routes/admin.rnd.tsx src/routes/admin.rnd.tsx
          cp formatted/src/lib/rnd-control.core.ts src/lib/rnd-control.core.ts
          cp formatted/src/lib/rnd-control.functions.ts src/lib/rnd-control.functions.ts
          if git diff --quiet; then
            echo "Formatter output already applied."
            exit 0
          fi
          git config user.name "RONSAS CI formatter"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/lib/rnd-control-security.test.ts src/routes/admin.index.tsx src/routes/admin.rnd.tsx src/lib/rnd-control.core.ts src/lib/rnd-control.functions.ts
          git commit -m "style: format Admin R&D control files"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
