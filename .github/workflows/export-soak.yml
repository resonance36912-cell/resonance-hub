name: Export keep-alive soak & multiworker

# Scheduled endurance guard for the app-status export fault path.
#
#   * keep-alive soak  — repeatedly triggers multi-offset ExportEncoderFaults
#     and retries on one reused connection, asserting no fd / socket / thread
#     growth (report.json + samples.csv).
#   * multiworker      — same keep-alive reuse + fault-retry assertions across
#     a SO_REUSEPORT worker pool, asserting no lingering sockets per worker.
#
# Growth-slope limits are tuned per suite: set GROWTH_SOAK_* for the keep-alive
# soak and GROWTH_LOAD_* for the load/idempotency job (e.g.
# GROWTH_SOAK_FD_SLOPE_PER_HOUR, GROWTH_LOAD_FD_SLOPE_PER_MIN,
# GROWTH_LOAD_SLOPE_TOLERANCE). The unscoped GROWTH_* forms still apply to both.
#
# Both write their artifacts under /tmp/browser/, which this workflow collects
# and uploads. The soak duration defaults to 30 minutes on CI (the local
# default is 2 hours); override it with the workflow_dispatch input.

on:
  schedule:
    # Weekly on Sunday at 02:15 UTC. Relevant PRs still get a short-window run.
    - cron: "15 2 * * 0"
  pull_request:
    # Short-window runs on PRs that touch the export or growth-guard code, so a
    # regression gets a measured-vs-limit diff table posted on the PR itself.
    paths:
      - "tests/e2e/app-status-export-*.py"
      - "tests/e2e/harness/**"
      - "src/lib/app-status-*.ts"
      - "src/routes/api/public/**"
      - ".github/workflows/export-soak.yml"
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Soak duration in seconds"
        required: false
        default: "1800"
      calibrate:
        description: "Auto-calibrate growth slope limits from this run (updates baselines/growth-thresholds.json)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: export-soak-${{ github.ref }}
  cancel-in-progress: false


jobs:
  soak:
    name: Keep-alive soak (multi-offset faults + retries)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the keep-alive soak
        env:
          SOAK_SECONDS: ${{ github.event.inputs.soak_seconds || (github.event_name == 'pull_request' && '300' || '1800') }}
          SAMPLE_SECONDS: "30"
          ROTATE_SECONDS: "300"
        run: python3 tests/e2e/app-status-export-keepalive-soak.py

      - name: Build growth report
        if: always()
        run: |
          python3 tests/e2e/harness/growth_report.py \
            /tmp/browser/app-status-keepalive-soak \
            --title "Keep-alive soak growth (run ${{ github.run_number }})"
          cat /tmp/browser/app-status-keepalive-soak/growth-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate growth threshold failures
        id: growth
        if: always()
        run: |
          python3 tests/e2e/harness/growth_annotate.py \
            /tmp/browser/app-status-keepalive-soak \
            --label "Keep-alive soak" \
            --artifact export-keepalive-soak \
            --slug keepalive-soak \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --comment-out /tmp/browser/app-status-keepalive-soak/growth-comment.md \
            --always-zero | tee /tmp/growth-annotate.log
          grep -q 'growth_ok=false' /tmp/growth-annotate.log && echo "ok=false" >> "$GITHUB_OUTPUT" || echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Comment the growth diff on the pull request
        if: always() && github.event_name == 'pull_request' && steps.growth.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(
              '/tmp/browser/app-status-keepalive-soak/growth-comment.md', 'utf8');
            const marker = '<!-- growth-report:keepalive-soak -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Auto-calibrate growth slope limits from recent successful runs
        if: always() && (github.event_name == 'schedule' || inputs.calibrate)
        run: |
          python3 tests/e2e/harness/growth_calibrate.py \
            --report /tmp/browser/app-status-keepalive-soak/report.json \
            --profile export-keepalive-soak --unit hour --suite SOAK \
            --run "$GITHUB_RUN_ID" --update | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit calibrated thresholds
        if: always() && github.event_name == 'schedule'
        run: |
          if git diff --quiet -- baselines/growth-thresholds.json; then
            echo "No threshold changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baselines/growth-thresholds.json
          git commit -m "chore(ci): calibrate export-keepalive-soak growth slope limits [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Fail when growth thresholds were exceeded
        if: always() && steps.growth.outputs.ok == 'false'
        run: |
          echo "Growth thresholds exceeded - see the annotations and growth-report.html artifact."
          exit 1

      - name: Upload soak report and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-keepalive-soak
          path: |
            /tmp/browser/app-status-keepalive-soak/report.json
            /tmp/browser/app-status-keepalive-soak/samples.csv
            /tmp/browser/app-status-keepalive-soak/progress.log
            /tmp/browser/app-status-keepalive-soak/growth-report.html
            /tmp/browser/app-status-keepalive-soak/growth-report.md
            /tmp/browser/app-status-keepalive-soak/growth-comment.md
          if-no-files-found: warn
          retention-days: 30



  multiworker:
    name: Multi-worker keep-alive reuse & fault retries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the multi-worker suite
        env:
          WORKERS: "4"
        run: python3 tests/e2e/app-status-export-multiworker.py

      - name: Upload multiworker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-multiworker
          path: |
            /tmp/browser/app-status-multiworker/report.json
            /tmp/browser/app-status-multiworker/summary.txt
          if-no-files-found: warn
          retention-days: 30

  lb-proxy:
    name: Fault retries behind a reverse proxy / load balancer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install nginx (second proxy mode)
        run: sudo apt-get update && sudo apt-get install -y nginx-light

      - name: Run the proxy / load-balancer suite
        env:
          UPSTREAMS: "3"
          LB_MODES: "bun,nginx"
        run: python3 tests/e2e/app-status-export-lb-proxy.py

      - name: Upload proxy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-lb-proxy
          path: |
            /tmp/browser/app-status-lb-proxy/report.json
            /tmp/browser/app-status-lb-proxy/nginx/logs/error.log

          if-no-files-found: warn
          retention-days: 30

  load-idempotency:
    name: Large-export load, fault idempotency & keep-alive reuse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the load / idempotency suite
        env:
          ROWS: "6000"
          CONCURRENCY: "12"
          ROUNDS: "8"
        run: python3 tests/e2e/app-status-export-load-idempotency.py

      - name: Build growth report
        if: always()
        run: |
          python3 tests/e2e/harness/growth_report.py \
            /tmp/browser/app-status-export-load-idem \
            --title "Load / idempotency growth (run ${{ github.run_number }})"
          cat /tmp/browser/app-status-export-load-idem/growth-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate growth threshold failures
        id: growth
        if: always()
        run: |
          python3 tests/e2e/harness/growth_annotate.py \
            /tmp/browser/app-status-export-load-idem \
            --label "Load / idempotency" \
            --artifact export-load-idempotency \
            --slug load-idempotency \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --comment-out /tmp/browser/app-status-export-load-idem/growth-comment.md \
            --always-zero | tee /tmp/growth-annotate.log
          grep -q 'growth_ok=false' /tmp/growth-annotate.log && echo "ok=false" >> "$GITHUB_OUTPUT" || echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Comment the growth diff on the pull request
        if: always() && github.event_name == 'pull_request' && steps.growth.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(
              '/tmp/browser/app-status-export-load-idem/growth-comment.md', 'utf8');
            const marker = '<!-- growth-report:load-idempotency -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Auto-calibrate growth slope limits from recent successful runs
        if: always() && (github.event_name == 'schedule' || inputs.calibrate)
        run: |
          python3 tests/e2e/harness/growth_calibrate.py \
            --report /tmp/browser/app-status-export-load-idem/report.json \
            --profile export-load-idempotency --unit minute --suite LOAD \
            --run "$GITHUB_RUN_ID" --update | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit calibrated thresholds
        if: always() && github.event_name == 'schedule'
        run: |
          if git diff --quiet -- baselines/growth-thresholds.json; then
            echo "No threshold changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baselines/growth-thresholds.json
          git commit -m "chore(ci): calibrate export-load-idempotency growth slope limits [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Fail when growth thresholds were exceeded
        if: always() && steps.growth.outputs.ok == 'false'
        run: |
          echo "Growth thresholds exceeded - see the annotations and growth-report.html artifact."
          exit 1

      - name: Upload load report and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-load-idempotency
          path: |
            /tmp/browser/app-status-export-load-idem/report.json
            /tmp/browser/app-status-export-load-idem/samples.csv
            /tmp/browser/app-status-export-load-idem/growth-report.html
            /tmp/browser/app-status-export-load-idem/growth-report.md
            /tmp/browser/app-status-export-load-idem/growth-comment.md
          if-no-files-found: warn
          retention-days: 30



