name: Dependabot lockfile sync

# Runs on every Dependabot PR. Purpose:
#   1. If Dependabot ever opens a PR that touches package.json but leaves
#      bun.lock stale, regenerate the lockfile and commit it back to the PR
#      branch so `verify-pinned-deps.ts` passes.
#   2. Re-run the pinned-deps guard + `bun audit` on the final state.
#
# Only Dependabot PRs trigger this job (checked via actor + PR head ref).

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/dependabot.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head so we can push a follow-up commit if needed.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile from package.json
        # `bun install` (no --frozen-lockfile) updates bun.lock to match
        # whatever Dependabot wrote into package.json.
        run: bun install

      - name: Sync overrides / pnpm.overrides from bun.lock
        # Dependabot doesn't touch `overrides` blocks. If a direct-dep bump
        # pulls a newer safe version of an overridden transitive (undici, ws,
        # vite, ...), advance the pin to match. Never downgrades.
        run: bun run scripts/sync-overrides-from-lock.ts

      - name: Re-install if overrides changed
        # Overrides changing means bun.lock may need to re-resolve. A second
        # `bun install` is cheap when nothing changed and correct when it did.
        run: bun install

      - name: Commit package.json + bun.lock if either changed
        run: |
          if ! git diff --quiet -- package.json bun.lock; then
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git add package.json bun.lock
            git commit -m "chore(deps): sync bun.lock + overrides after Dependabot bump"
            git push
          else
            echo "package.json and bun.lock already in sync."
          fi

      - name: Verify pinned dependency versions
        id: verify_pins
        run: |
          set +e
          out=$(bun run scripts/verify-pinned-deps.ts 2>&1)
          code=$?
          echo "$out"
          {
            echo "exit_code=$code"
            echo "output<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $code

      - name: Verify overrides match bun.lock
        run: bun run scripts/sync-overrides-from-lock.ts --check

      - name: bun audit (high+)
        id: bun_audit
        run: |
          set +e
          out=$(bun audit --audit-level=high 2>&1)
          code=$?
          echo "$out"
          {
            echo "exit_code=$code"
            echo "output<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $code

      - name: Post/update PR summary comment
        # Sticky comment (marker-based) summarizing pinned-deps + bun audit so
        # reviewers see security impact without digging through logs.
        if: always()
        uses: actions/github-script@v7
        env:
          PINS_STATUS: ${{ steps.verify_pins.outcome }}
          PINS_OUTPUT: ${{ steps.verify_pins.outputs.output }}
          AUDIT_STATUS: ${{ steps.bun_audit.outcome }}
          AUDIT_OUTPUT: ${{ steps.bun_audit.outputs.output }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- dependabot-sync-summary -->';
            const icon = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';
            const pins = process.env.PINS_OUTPUT || '(no output)';
            const audit = process.env.AUDIT_OUTPUT || '(no output)';
            const trim = (s, n = 6000) => s.length > n ? s.slice(0, n) + `\n… (truncated, ${s.length - n} more chars)` : s;
            const body = [
              marker,
              '### Dependabot sync summary',
              '',
              `- ${icon(process.env.PINS_STATUS)} \`verify-pinned-deps.ts\` — **${process.env.PINS_STATUS}**`,
              `- ${icon(process.env.AUDIT_STATUS)} \`bun audit --audit-level=high\` — **${process.env.AUDIT_STATUS}**`,
              '',
              '<details><summary>verify-pinned-deps.ts output</summary>',
              '',
              '```',
              trim(pins),
              '```',
              '',
              '</details>',
              '',
              '<details><summary>bun audit output</summary>',
              '',
              '```',
              trim(audit),
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
