name: Probe Railway CI authorization

on:
  push:
    branches:
      - ronsas/railway-auth-probe-20260922
    paths:
      - ".github/workflows/probe-railway-auth-20260922.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Report Railway credential availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          project_token=false
          account_token=false
          if [ -n "${RAILWAY_TOKEN:-}" ]; then project_token=true; fi
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then account_token=true; fi
          echo "railway_project_token_present=${project_token}"
          echo "railway_api_token_present=${account_token}"
          if [ "${project_token}" = false ] && [ "${account_token}" = false ]; then
            echo "railway_ci_authorized=false"
          else
            echo "railway_ci_authorized=true"
          fi
