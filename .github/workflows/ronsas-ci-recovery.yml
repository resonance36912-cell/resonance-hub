name: RONSAS CI recovery monitor

on:
  workflow_run:
    workflows:
      - Verify prebuild
      - CodeQL
      - Security scan
      - Verify checkout links
      - Verify commercial mode
      - Verify ePublisher checkout
      - Verify Manifest Integrity
      - Verify pinned dependencies
      - Verify route strings
      - Dependabot lockfile sync
      - Outdated pinned dependencies
      - App status drift watch
      - return_to coverage report
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ronsas-ci-recovery-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out' ||
          github.event.workflow_run.conclusion == 'startup_failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify failure and perform bounded recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/ronsas-ci-recovery-${RUN_ID}.log"
          gh run view "$RUN_ID" --repo "$REPO" --log-failed >"$log" 2>&1 || true

          classification="deterministic-ci-failure"
          action="persistent failure recorded; source/config repair required"

          if grep -Eqi 'ECONNRESET|ETIMEDOUT|TLS handshake timeout|Connection reset by peer|HTTP([^0-9]|response[^0-9]*|status[=: ]*)+(429|502|503|504)|Unexpected HTTP response[^0-9]*(429|502|503|504)|received HTTP status[=: ]*(429|502|503|504)|rate limit|runner.*(lost|offline)|Unable to resolve action|failed to download action|Service Unavailable|The hosted runner lost communication' "$log"; then
            classification="transient-infrastructure"
            if [ "${RUN_ATTEMPT:-1}" -lt 2 ]; then
              if gh run rerun "$RUN_ID" --repo "$REPO" --failed; then
                action="automatic failed-job rerun requested once"
              else
                action="transient failure detected but automatic rerun request failed"
              fi
            else
              action="transient failure already retried once; no loop permitted"
            fi
          elif grep -Eqi 'generic-api-key' "$log" && grep -Eqi 'SUPABASE_PUBLISHABLE_KEY' "$log"; then
            classification="gitleaks-publishable-client-key"
          elif grep -Eqi 'leaks found|gitleaks' "$log"; then
            classification="secret-scan"
          elif grep -Eqi 'bun audit|vulnerabilities \([0-9]+ high\)|[0-9]+ vulnerabilities .*high|high: .*GHSA-' "$log"; then
            classification="dependency-security"
          elif grep -Eqi 'bun: command not found|command not found.*bun' "$log"; then
            classification="ci-tooling"
          elif grep -Eqi 'manifest|bun.lock|package.json|run deep links|test[s]? failed' "$log"; then
            classification="test-or-manifest-contract"
          elif grep -Eqi 'CodeQL|Semgrep|SARIF|security scan' "$log"; then
            classification="security-analysis"
          fi

          if [ "$classification" = "transient-infrastructure" ] && [ "$action" = "automatic failed-job rerun requested once" ]; then
            echo "::notice::RONSAS CI recovery classified ${WORKFLOW_NAME} as ${classification}; ${action}"
            exit 0
          fi

          marker='<!-- ronsas-ci-recovery -->'
          body=$(cat <<EOF
          ${marker}
          ### RONSAS CI recovery monitor

          Latest failing workflow: **${WORKFLOW_NAME}**

          - Run: ${RUN_URL}
          - Branch: \`${HEAD_BRANCH:-unknown}\`
          - Head: \`${HEAD_SHA}\`
          - Source event: \`${SOURCE_EVENT}\`
          - Classification: \`${classification}\`
          - Recovery action: ${action}

          The monitor intentionally does not execute untrusted PR code or rewrite application source. It retries only recognized transient infrastructure failures, once. Deterministic failures are consolidated here for repair instead of spawning an unbounded retry loop.
          EOF
          )

          pr_number=$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$pr_number" ]; then
            comments=$(gh api "repos/$REPO/issues/$pr_number/comments?per_page=100" --paginate 2>/dev/null || echo '[]')
            comment_id=$(printf '%s' "$comments" | jq -r --arg marker "$marker" '.[] | select((.body // "") | contains($marker)) | .id' | tail -n 1)
            if [ -n "$comment_id" ] && [ "$comment_id" != "null" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" >/dev/null 2>&1 || true
            else
              gh api --method POST "repos/$REPO/issues/$pr_number/comments" -f body="$body" >/dev/null 2>&1 || true
            fi
          else
            issue_title="RONSAS CI recovery: ${HEAD_BRANCH:-default}"
            issues=$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate 2>/dev/null || echo '[]')
            issue_number=$(printf '%s' "$issues" | jq -r --arg title "$issue_title" '.[] | select(.pull_request == null and .title == $title) | .number' | tail -n 1)
            if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
              gh api --method PATCH "repos/$REPO/issues/$issue_number" -f body="$body" >/dev/null 2>&1 || true
            else
              gh api --method POST "repos/$REPO/issues" -f title="$issue_title" -f body="$body" >/dev/null 2>&1 || true
            fi
          fi

          echo "::notice::RONSAS CI recovery classified ${WORKFLOW_NAME} as ${classification}; ${action}"
          exit 0

  autofix-formatting:
    if: >-
      ${{ github.event.workflow_run.name == 'Verify prebuild' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Inspect failed log for formatting-only repair signal
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ronsas-format-autofix-${RUN_ID}.log"
          gh run view "$RUN_ID" --repo "$REPO" --log-failed >"$log" 2>&1 || true
          if grep -Eq 'prettier/prettier|Code style issues found|prettier --check' "$log"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting repair signal found; skipping safe autofix."
          fi

      - name: Check out trusted failing main SHA
        if: steps.inspect.outputs.needed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Set up Bun for safe formatter repair
        if: steps.inspect.outputs.needed == 'true'
        id: autofix_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Retry Bun setup for safe formatter repair
        if: steps.inspect.outputs.needed == 'true' && steps.autofix_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Format only files changed by the failing main commit
        if: steps.inspect.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMRTUXB HEAD^ HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yml' '*.yaml' | grep -Ev '^(dist|\.output|\.vinxi|src/routeTree\.gen\.ts)' || true)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No formatter-eligible changed files."
            exit 0
          fi
          printf 'Safe formatting repair candidates:\n'
          printf '  %s\n' "${CHANGED[@]}"
          bunx prettier --write "${CHANGED[@]}"

      - name: Publish bounded formatter repair PR
        if: steps.inspect.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter produced no changes; no repair PR required."
            exit 0
          fi
          repair_branch="ronsas/ci-autofix-format-${RUN_ID}"
          git config user.name "RONSAS CI recovery"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$repair_branch"
          git add -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yml' '*.yaml'
          git commit -m "style: auto-repair formatting after CI failure"
          git push origin "$repair_branch"
          existing=$(gh pr list --repo "$REPO" --head "$repair_branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --repo "$REPO" --base main --head "$repair_branch" \
              --title "style: RONSAS CI formatting self-heal" \
              --body "Automated bounded formatter-only repair for failed Verify prebuild run ${RUN_URL}. Source main SHA: `${HEAD_SHA}`. No semantic autofix is attempted."
          else
            echo "Repair PR already exists: #$existing"
          fi
