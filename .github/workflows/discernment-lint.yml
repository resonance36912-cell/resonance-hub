name: Discernment Lint (Reusable)

# Reusable workflow for every Resonance spoke (ePublisher, Creative Studio,
# Sync Vision, YouTube Optimizer). It runs the canonical generation-route
# Discernment linter and fails the PR if any `*generate*` route bypasses the
# shared guard or provenance label.
#
# Usage from a spoke repo (.github/workflows/discernment-lint.yml):
#
#   name: Discernment Lint
#   on:
#     pull_request:
#       paths:
#         - 'src/**/*generate*.functions.ts'
#         - 'src/**/*generate*.server.ts'
#         - 'src/routes/api/**/*generate*.ts'
#         - 'scripts/verify-discernment-usage.ts'
#         - 'src/lib/discernment*.ts'
#     push:
#       branches: [main]
#   jobs:
#     discernment:
#       uses: resonance-org/resonance-hub/.github/workflows/discernment-lint.yml@main
#
# The spoke MUST keep `scripts/verify-discernment-usage.ts` and
# `src/lib/discernment-guard.ts` byte-identical to the Hub copies — the
# `parity` job below enforces that by checksumming against the Hub at
# workflow run time.

on:
  workflow_call:
    inputs:
      hub-ref:
        description: Git ref of resonance-hub to compare contract files against.
        required: false
        type: string
        default: main
      hub-repo:
        description: Owner/name of the Hub repo that owns the contract.
        required: false
        type: string
        default: resonance-org/resonance-hub
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    name: Generation-route lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout spoke
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Discernment lint script is present
        run: |
          test -f scripts/verify-discernment-usage.ts \
            || (echo "::error::Missing scripts/verify-discernment-usage.ts. Copy it from resonance-hub." && exit 1)
          test -f src/lib/discernment.ts \
            || (echo "::error::Missing src/lib/discernment.ts. Copy it from resonance-hub." && exit 1)
          test -f src/lib/discernment-guard.ts \
            || (echo "::error::Missing src/lib/discernment-guard.ts. Copy it from resonance-hub." && exit 1)

      - name: Run Discernment lint
        id: lint
        continue-on-error: true
        run: bun run scripts/verify-discernment-usage.ts

      - name: Generate Discernment usage report
        if: always()
        run: bun run scripts/report-discernment-usage.ts

      - name: Upload Discernment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discernment-usage-report
          path: reports/discernment-usage.md
          if-no-files-found: ignore

      - name: Post / update Discernment PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/discernment-usage.md';
            if (!fs.existsSync(path)) {
              core.info('No report file; skipping PR comment.');
              return;
            }
            const report = fs.readFileSync(path, 'utf8');
            const marker = '<!-- discernment-usage-report -->';
            const lintOutcome = '${{ steps.lint.outcome }}';
            const statusLine = lintOutcome === 'success'
              ? '> ✅ **Lint passed** — every generation route satisfies the Discernment contract.'
              : '> ❌ **Lint failed** — one or more generation routes bypass the guard or provenance label. See job log.';
            const body = `${marker}\n${statusLine}\n\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated PR comment #${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Created Discernment usage PR comment.');
            }

      - name: Publish Discernment check run
        id: check_run
        if: always()
        uses: actions/github-script@v7

        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/discernment-violations.json';
            if (!fs.existsSync(path)) {
              core.info('No violations file; skipping check run.');
              return;
            }
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const violations = data.violations || [];
            const outcome = process.env.LINT_OUTCOME;
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            const runId = context.runId;
            const artifactsUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}#artifacts`;

            // Aggregate by rule
            const byRule = {};
            for (const v of violations) {
              byRule[v.rule] = (byRule[v.rule] || 0) + 1;
            }
            const ruleRows = Object.entries(byRule)
              .sort((a, b) => b[1] - a[1])
              .map(([rule, n]) => `| \`${rule}\` | ${n} |`).join('\n');

            const conclusion = outcome === 'success' ? 'success' : 'failure';
            const summary = outcome === 'success'
              ? `✅ All ${data.routesScanned} generation route(s) satisfy the Discernment contract.`
              : `❌ ${violations.length} violation(s) across ${data.routesScanned} generation route(s).`;
            const text = [
              summary,
              '',
              `**Full report artifact:** [discernment-usage-report](${artifactsUrl})`,
              '',
              violations.length
                ? '### Violations by rule\n\n| Rule | Count |\n| --- | ---: |\n' + ruleRows
                : '',
            ].filter(Boolean).join('\n');

            // GitHub caps annotations at 50 per Check Run update.
            const annotations = violations.slice(0, 50).map(v => ({
              path: v.file,
              start_line: v.line,
              end_line: v.line,
              annotation_level: 'failure',
              title: `Discernment: ${v.rule}`,
              message: v.fix ? `${v.message}\nFix: ${v.fix}` : v.message,
            }));

            const { data: check } = await github.rest.checks.create({
              owner, repo,
              name: 'Discernment Contract',
              head_sha: sha,
              status: 'completed',
              conclusion,
              output: {
                title: summary,
                summary,
                text,
                annotations,
              },
            });
            core.info(`Published Discernment check run (${conclusion}, ${annotations.length} annotations).`);
            core.setOutput('check_url', check.html_url);
            core.setOutput('check_id', String(check.id));
            core.setOutput('conclusion', conclusion);
            core.setOutput('summary', summary);
            core.setOutput('rule_rows', ruleRows);
            core.setOutput('violation_count', String(violations.length));
            core.setOutput('routes_scanned', String(data.routesScanned));
            core.setOutput('artifacts_url', artifactsUrl);

      - name: Post / update Discernment check-run PR summary
        if: always() && github.event_name == 'pull_request' && steps.check_run.outputs.check_url
        uses: actions/github-script@v7
        env:
          CHECK_URL: ${{ steps.check_run.outputs.check_url }}
          CONCLUSION: ${{ steps.check_run.outputs.conclusion }}
          SUMMARY: ${{ steps.check_run.outputs.summary }}
          RULE_ROWS: ${{ steps.check_run.outputs.rule_rows }}
          VIOLATION_COUNT: ${{ steps.check_run.outputs.violation_count }}
          ROUTES_SCANNED: ${{ steps.check_run.outputs.routes_scanned }}
          ARTIFACTS_URL: ${{ steps.check_run.outputs.artifacts_url }}
        with:
          script: |
            const marker = '<!-- discernment-check-summary -->';
            const {
              CHECK_URL, CONCLUSION, SUMMARY,
              RULE_ROWS, VIOLATION_COUNT, ROUTES_SCANNED, ARTIFACTS_URL,
            } = process.env;
            const badge = CONCLUSION === 'success' ? '✅ **Passed**' : '❌ **Failed**';
            const breakdown = Number(VIOLATION_COUNT) > 0 && RULE_ROWS
              ? `\n\n**Violation breakdown**\n\n| Rule | Count |\n| --- | ---: |\n${RULE_ROWS}`
              : '\n\n_No violations._';
            const body = [
              marker,
              `### Discernment Contract Check — ${badge}`,
              '',
              SUMMARY,
              '',
              `🔗 [Open the Discernment Contract check run](${CHECK_URL})`,
              `📎 [Download full usage report artifact](${ARTIFACTS_URL})`,
              '',
              `Routes scanned: **${ROUTES_SCANNED}** · Violations: **${VIOLATION_COUNT}**`,
              breakdown,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated check-run summary comment #${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Created Discernment check-run summary comment.');
            }

      - name: Fail job if lint failed
        if: steps.lint.outcome == 'failure'
        run: |
          echo "::error::Discernment lint failed — see PR comment / check run."
          exit 1


  parity:
    name: Contract file parity vs Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spoke
        uses: actions/checkout@v4
        with:
          path: spoke

      - name: Checkout Hub (contract source of truth)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.hub-repo }}
          ref: ${{ inputs.hub-ref }}
          path: hub

      - name: Compare contract files
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in \
            scripts/verify-discernment-usage.ts \
            src/lib/discernment.ts \
            src/lib/discernment-guard.ts
          do
            if ! diff -q "hub/$f" "spoke/$f" >/dev/null 2>&1; then
              echo "::error file=$f::Spoke copy of $f drifts from resonance-hub@${{ inputs.hub-ref }}. Re-sync the file from the Hub."
              diff -u "hub/$f" "spoke/$f" || true
              fail=1
            fi
          done
          exit $fail
