name: Temporary format PR84

on:
  push:
    branches:
      - ronsas/admin-promotion-telemetry-20260922

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ronsas/admin-promotion-telemetry-20260922
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Format target and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          bun x prettier --write src/routes/admin.control-center.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.control-center.tsx
          git rm .github/workflows/temp-format-pr84.yml
          git commit -m "style(admin): format promotion telemetry UI"
          git push origin HEAD:ronsas/admin-promotion-telemetry-20260922
