name: One-shot Hub dependency advisory repair 2026-09-21

on:
  push:
    branches:
      - ronsas/security-ci-hardening-20260921
    paths:
      - ".github/workflows/repair-security-deps-20260921.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: ronsas/security-ci-hardening-20260921
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Re-resolve overrides and apply audit fixes
        shell: bash
        run: |
          set -uo pipefail
          bun install
          set +e
          bun audit fix
          AUDIT_FIX_EXIT=$?
          set -e
          echo "bun audit fix exit=$AUDIT_FIX_EXIT"
          bun run scripts/sync-overrides-from-lock.ts
          bun install
          bun run scripts/verify-deps-pinned.ts

      - name: Commit dependency repair if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            echo "No dependency files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "fix(deps): repair high-severity advisory chain"
          git push origin HEAD:ronsas/security-ci-hardening-20260921

      - name: Require clean high-severity audit
        run: bun audit --audit-level=high
