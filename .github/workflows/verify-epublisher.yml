name: Verify ePublisher checkout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ePublisher tier amount checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify ePublisher tier amounts (end-to-end)
        run: bun run verify:epublisher

      - name: Verify ALL Resonance App tiers (end-to-end)
        run: bun run verify:all-apps

      - name: Verify Back to Hub coverage on all user-facing pages
        run: bun run verify:back-to-hub
