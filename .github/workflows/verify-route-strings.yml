name: Verify route strings

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  verify:
    name: Scan href / to / navigate for invalid routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Emits ::error annotations on every offending line AND appends a
      # single Markdown table to the job summary via GITHUB_STEP_SUMMARY.
      # Non-zero exit fails the job with the full report attached.
      - name: verify-route-strings
        run: bun run verify:route-strings

      - name: Route registry parity tests
        if: always()
        run: bun run test:route-registry
