name: Verify prebuild

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Run all prebuild verification scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need history so diff-based lint can compare against the base ref.
          fetch-depth: 0

      # Secret scanning: gitleaks inspects the checked-out tree (and, on PRs,
      # the diff against the base ref) for high-confidence credential
      # patterns — API keys, tokens, private keys, provider secrets. Fails
      # the build on any finding. Runs before install/build so a leaked
      # credential is caught even if later steps would fail for other
      # reasons.
      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE — required only for org-owned private repos
          # under the paid tier. Public repos and personal repos run free.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Two-layer bun cache:
      #   1. ~/.bun/install/cache — bun's global download store. Restored
      #      on any prior run for this OS; makes cold installs cheaper even
      #      when the lockfile changed. Uses restore-keys as a fallback.
      #   2. node_modules — the fully-resolved dependency tree. Restored
      #      only on an EXACT match of (bun version + lockfile hash), so a
      #      hit skips `bun install` entirely. No restore-keys here on
      #      purpose: a partial restore would leave a stale tree that
      #      doesn't match the current lockfile and would silently poison
      #      later steps.
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache_node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-nm-1.3.3-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', '.npmrc', 'bunfig.toml') }}

      - name: Install dependencies
        if: steps.cache_node_modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # Dependency vulnerability scan. Reads the lockfile, not node_modules
      # state, so it stays authoritative whether or not the install step
      # was skipped by a cache hit. Fails the build on any high- or
      # critical-severity advisory.
      - name: Audit dependencies for high-severity vulnerabilities
        run: bun audit --audit-level=high

      # SBOM: syft scans the installed node_modules + lockfile and emits a
      # CycloneDX + SPDX inventory of every shipped dependency. Uploaded as
      # a workflow artifact for supply-chain traceability (auditing what
      # exact versions were built into a given commit). Non-blocking.
      - name: Generate SBOM (syft, CycloneDX + SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json
          output-file: sbom-cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (syft, SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-spdx.json
          output-file: sbom-spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
          if-no-files-found: warn
          retention-days: 90

      # Cache Vite's transform cache. Restored across runs so unchanged
      # modules skip re-transformation. Safe: Vite invalidates entries
      # whose source or config hash changed.
      - name: Cache Vite build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-vite-

      # Prettier: 134 files currently have style drift. Surface without
      # blocking until the backlog is formatted; flip continue-on-error to
      # false to enforce. Runs before typecheck/lint/smoke so style issues
      # show up first in the log.
      - name: Prettier format check
        continue-on-error: true
        run: bunx prettier --check .

      # Cache tsc's incremental build info. Restored across runs so unchanged
      # files skip re-checking. Key includes tsconfig + lockfile hash so a
      # config or dependency change invalidates the cache automatically.
      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/tsc
          key: ${{ runner.os }}-tsc-${{ hashFiles('tsconfig.json', 'bun.lock', 'bun.lockb') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('tsconfig.json', 'bun.lock', 'bun.lockb') }}-
            ${{ runner.os }}-tsc-

      # `tsc --noEmit` is the primary guard against invalid route strings:
      # TanStack Router types `<Link to>`, `navigate({ to })`, and
      # `redirect({ to })` against the generated route registry, so a stale
      # path like `/auth` (a real regression we fixed once) fails the build
      # here. Non-blocking would defeat the purpose — keep this step hard.
      - name: TypeScript typecheck (fails on invalid route strings)
        run: bun run typecheck

      # Belt-and-braces: catch route strings that bypass the type system
      # (plain `<a href>`, `window.location.href = ...`, template literals
      # assembled outside a Link/navigate call).
      - name: Verify hardcoded route strings resolve to real routes
        run: bun run verify:route-strings

      # Parity tests: every ROUTES constant and LINKS preset in src/lib/routes.ts
      # must match a `fullPath` in src/routeTree.gen.ts exactly (no trailing
      # slashes, no duplicates, no drift). Hard-fails the build on regression.
      - name: Verify ROUTES/LINKS ↔ router registry parity
        run: |
          bun test \
            scripts/lib/route-path.test.ts \
            scripts/lib/route-registry.test.ts \
            scripts/lib/app-link.test.tsx

      # Lint has ~2400 preexisting issues in this repo — surface them without
      # blocking the pipeline until the backlog is cleaned up. Flip
      # continue-on-error to false to enforce.
      # Full-repo lint has ~2400 preexisting issues — surface them without
      # blocking until the backlog is cleaned up.
      - name: Lint backlog (full repo, non-blocking)
        continue-on-error: true
        run: bun run lint

      # Diff-based lint: hard-fail on any lint error introduced in files
      # changed by this PR / push. Existing backlog in untouched files is
      # ignored, but new/edited files must be clean.
      #
      # Base ref resolution:
      #   - PRs: compare against the PR base branch SHA
      #   - Push to main: compare against the previous commit
      - name: Lint changed files (blocking)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA:-}" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$BEFORE_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          echo "Diffing against base: $BASE_SHA"
          # Only .ts/.tsx files that still exist (exclude deleted).
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA"...HEAD -- '*.ts' '*.tsx' | grep -Ev '^(dist|\.output|\.vinxi|src/routeTree\.gen\.ts|src/integrations/supabase/types\.ts)' || true)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No changed .ts/.tsx files to lint."
            exit 0
          fi
          printf 'Linting %d changed file(s):\n' "${#CHANGED[@]}"
          printf '  %s\n' "${CHANGED[@]}"
          bunx eslint --max-warnings=0 "${CHANGED[@]}"

      - name: Check price parity (SKU_CATALOG vs pricing UI)
        run: bun run check:prices

      # Unit/integration tests. Hard-fails CI on any failure. Runs before
      # smoke tests so logic regressions surface before we spin up a server.
      - name: Unit & integration tests (bun test)
        run: bun run test:ci

      # Publish test results (JUnit) and coverage (lcov) for quick failure
      # triage. Runs on success and failure so red builds still surface the
      # JUnit report in the Actions UI.
      - name: Upload test results (JUnit + coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.sha }}
          path: |
            reports/junit.xml
            reports/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Run all prebuild verification scripts
        run: bun run prebuild

      # Smoke test target resolution:
      #   1. If `vars.SMOKE_BASE_URL` (repository/environment variable) is set, use it —
      #      typically the deployed preview URL (e.g. https://id-preview--<id>.lovable.app
      #      or https://project--<id>-dev.lovable.app).
      #   2. Otherwise build locally and serve .output/server via wrangler dev on :8080.
      - name: Resolve smoke test BASE_URL
        id: smoke_target
        env:
          CONFIGURED_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          if [ -n "$CONFIGURED_BASE_URL" ]; then
            echo "base_url=$CONFIGURED_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "needs_local=false" >> "$GITHUB_OUTPUT"
            echo "Using configured BASE_URL: $CONFIGURED_BASE_URL"
          else
            echo "base_url=http://localhost:8080" >> "$GITHUB_OUTPUT"
            echo "needs_local=true" >> "$GITHUB_OUTPUT"
            echo "No SMOKE_BASE_URL configured; will start local dev server"
          fi

      - name: Build production bundle
        if: steps.smoke_target.outputs.needs_local == 'true'
        run: bun run build

      # The TanStack/Nitro Cloudflare build emits a Worker at
      # .output/server/index.mjs plus its own wrangler.json. wrangler dev serves
      # the real production worker — closer to prod than `vite dev`.
      - name: Start production preview (wrangler dev) for smoke test
        if: steps.smoke_target.outputs.needs_local == 'true'
        working-directory: .output/server
        run: |
          bunx wrangler dev --config wrangler.json --port 8080 --ip 127.0.0.1 > /tmp/preview-server.log 2>&1 &
          echo $! > /tmp/preview-server.pid
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "Preview server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start" >&2
          tail -40 /tmp/preview-server.log >&2
          exit 1

      - name: Wait for remote preview to respond
        if: steps.smoke_target.outputs.needs_local == 'false'
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: |
          for i in {1..30}; do
            if curl -sfL "$BASE_URL/" > /dev/null; then
              echo "Remote preview ready at $BASE_URL"
              exit 0
            fi
            sleep 2
          done
          echo "Remote preview $BASE_URL did not respond" >&2
          exit 1

      - name: Smoke test hub routes
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: bun run scripts/smoke-hub-routes.ts

      # End-to-end contract: SSR-rendered homepage roadmap uses Phase 7
      # lifecycle labels (no Q-style hard dates) and every /legal route
      # ships a distinct <title>. Runs against the same wrangler-served
      # production Worker as the other smoke steps.
      - name: Smoke test legal + roadmap SSR contract
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: bun run scripts/smoke-legal-roadmap.ts

      # End-to-end contract: every /apps/$appKey page renders its title,
      # meta description, three capability highlights, and a safe external
      # link to the app's canonical URL server-side. Invalid keys not-find.
      - name: Smoke test app detail SSR contract
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: bun run scripts/smoke-app-detail.ts

      # Every app's rendered status badge + access line must match its
      # registry status (regression: Sync Vision shipped but badged "Beta").
      - name: Smoke test app status badges
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: bun run scripts/smoke-app-status-badges.ts

      # Link previews must carry the same status meaning the page renders,
      # so a "Beta" app never looks unreleased when shared.
      - name: Smoke test app OpenGraph/Twitter status meta
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: bun run scripts/smoke-app-status-meta.ts

      # E2E: /admin/roadmap redirects anon users to /admin/login and (when a
      # session with admin role is injected) renders the full CRUD surface.
      # The admin roadmap contract is a Python Playwright E2E. Install the
      # runner dependency and Chromium explicitly so this gate is reproducible
      # rather than depending on an image-specific preinstallation.
      - name: Set up Python Playwright for admin E2E
        run: |
          python3 -m pip install --disable-pip-version-check --no-input playwright
          python3 -m playwright install --with-deps chromium

      - name: E2E admin/roadmap auth + CRUD gate
        env:
          E2E_BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
          DEBUG: pw:browser
          PYTHONUNBUFFERED: "1"
        run: python3 tests/e2e/admin-roadmap-auth-gate.py

      # Share/SEO head tags on /apps/<unknown-slug>: required tag set, single
      # instance of each, title ≤60 / description ≤160, og/twitter/canonical
      # parity, noindex+follow, real 404 status, and hostile slugs staying
      # escaped — asserted on both SSR HTML and the hydrated DOM.
      - name: E2E not-found share + SEO meta tags
        if: steps.smoke_target.outputs.needs_local == 'true'
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: python3 tests/e2e/app-not-found-share-meta.py

      - name: Verify sitemap.xml, robots.txt, and pricing anchors
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: bun run scripts/verify-sitemap-robots.ts

      # Security-scan RPC integration tests moved to the dedicated
      # `security-scan-integration` matrix job below. That job fans out
      # over mode=[live, mock] so a regression under either configuration
      # fails CI independently, and keeps live-mode secret handling +
      # artifact upload isolated from mock-mode's no-secret path.

      # Lighthouse: performance ≥ 0.80, accessibility ≥ 0.90 (see lighthouserc.json).
      # Only runs when we have a locally served build — skipping for remote preview
      # keeps LHCI from hitting arbitrary URLs the workflow doesn't own.
      - name: Lighthouse CI (performance + a11y thresholds)
        if: steps.smoke_target.outputs.needs_local == 'true'
        run: bunx --bun @lhci/cli@0.14.x autorun --config=./lighthouserc.json

      # Lighthouse score gate for /apps/<unknown-slug>: hard-fails when
      # performance / accessibility / best-practices / SEO fall below their
      # committed floors OR regress past the tolerance vs
      # baselines/lighthouse-not-found.json. Median of 3 runs per URL.
      - name: Lighthouse score gate (not-found page)
        if: steps.smoke_target.outputs.needs_local == 'true'
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
          LH_RUNS: "3"
          LH_TOLERANCE: "0.05"
        run: bun run scripts/verify-lighthouse-not-found.ts

      - name: Upload not-found Lighthouse reports
        if: always() && steps.smoke_target.outputs.needs_local == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-not-found
          path: reports/lighthouse-not-found/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop preview server
        if: always() && steps.smoke_target.outputs.needs_local == 'true'
        run: |
          if [ -f /tmp/preview-server.pid ]; then
            kill "$(cat /tmp/preview-server.pid)" 2>/dev/null || true
          fi
          pkill -f workerd 2>/dev/null || true
          pkill -f wrangler 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Security-scan RPC integration tests — matrix over `mode`.
  #
  #   mode=live  Boots the production wrangler preview (or reuses
  #              vars.SMOKE_BASE_URL) and drives the real deployed handler
  #              over the TanStack Start serverFn RPC. Requires the
  #              SUPABASE_ADMIN_ACCESS_TOKEN repository secret; hard-fails
  #              when unset so a missing token can't silently mask
  #              regressions (the suites self-skip on missing auth).
  #              Records every /_serverFn/* response body and uploads the
  #              log + payloads as an artifact on failure.
  #
  #   mode=mock  Runs the same five suites against the in-process fetch
  #              shim in scripts/lib/security-scan-mock.ts, which
  #              synthesizes the exact Seroval wire contract. No server,
  #              no secret, no network — gates shape/auth-envelope drift
  #              on every PR (including forks that can't read secrets).
  #
  # Both matrix cells run independently: a regression under either
  # configuration fails CI on its own row, so a live-only flake never
  # hides a mock contract break and a mock-only shape change never hides
  # a live handler regression.
  # ---------------------------------------------------------------------------
  security-scan-integration:
    name: Security scan RPC integration tests (${{ matrix.mode }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [live, mock]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Cache node_modules
        id: cache_node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-nm-1.3.3-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', '.npmrc', 'bunfig.toml') }}

      - name: Install dependencies
        if: steps.cache_node_modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # -- Live-mode-only preview setup ---------------------------------------
      - name: Resolve smoke test BASE_URL (live)
        if: matrix.mode == 'live'
        id: smoke_target
        env:
          CONFIGURED_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          if [ -n "$CONFIGURED_BASE_URL" ]; then
            echo "base_url=$CONFIGURED_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "needs_local=false" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=http://localhost:8080" >> "$GITHUB_OUTPUT"
            echo "needs_local=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Vite build cache (live)
        if: matrix.mode == 'live' && steps.smoke_target.outputs.needs_local == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('bun.lock', 'bun.lockb', 'vite.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-vite-

      - name: Build production bundle (live)
        if: matrix.mode == 'live' && steps.smoke_target.outputs.needs_local == 'true'
        run: bun run build

      - name: Start production preview (live, wrangler dev)
        if: matrix.mode == 'live' && steps.smoke_target.outputs.needs_local == 'true'
        working-directory: .output/server
        run: |
          bunx wrangler dev --config wrangler.json --port 8080 --ip 127.0.0.1 > /tmp/preview-server.log 2>&1 &
          echo $! > /tmp/preview-server.pid
          for i in {1..90}; do
            if curl -sf http://127.0.0.1:8080/ > /dev/null; then
              echo "Preview server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start" >&2
          tail -40 /tmp/preview-server.log >&2
          exit 1

      - name: Wait for remote preview (live)
        if: matrix.mode == 'live' && steps.smoke_target.outputs.needs_local == 'false'
        env:
          BASE_URL: ${{ steps.smoke_target.outputs.base_url }}
        run: |
          for i in {1..30}; do
            if curl -sfL "$BASE_URL/" > /dev/null; then
              echo "Remote preview ready at $BASE_URL"
              exit 0
            fi
            sleep 2
          done
          echo "Remote preview $BASE_URL did not respond" >&2
          exit 1

      # -- Run the five suites, per matrix mode -------------------------------
      - name: Security scan RPC integration tests (live)
        if: matrix.mode == 'live'
        id: security_scan_tests_live
        env:
          DEV_SERVER_URL: ${{ steps.smoke_target.outputs.base_url }}
          LOVABLE_BROWSER_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ADMIN_ACCESS_TOKEN }}
          SECURITY_SCAN_ARTIFACT_DIR: reports/security-scan/payloads
        run: |
          set -euo pipefail
          if [ -z "${LOVABLE_BROWSER_SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ADMIN_ACCESS_TOKEN repository secret is not set." >&2
            echo "::error::The security-scan integration tests self-skip without a bearer, which would silently mask regressions. Configure the secret and re-run." >&2
            exit 1
          fi
          mkdir -p reports/security-scan
          bun test \
            --preload ./scripts/lib/security-scan-fetch-recorder.ts \
            scripts/lib/security-scan-auth.test.ts \
            scripts/lib/security-scan-success.test.ts \
            scripts/lib/security-scan-decode.test.ts \
            scripts/lib/security-scan-grouping.test.ts \
            scripts/lib/security-scan-zero-alerts.test.ts \
            2>&1 | tee reports/security-scan/tests.log

      - name: Upload security-scan test logs and payloads (live, on failure)
        if: matrix.mode == 'live' && failure() && steps.security_scan_tests_live.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-live-failure-${{ github.run_id }}-${{ github.sha }}
          path: |
            reports/security-scan/tests.log
            reports/security-scan/payloads/**
          if-no-files-found: warn
          retention-days: 14

      # Mock-mode preload order matters:
      #   1. security-scan-mock.ts installs the synthetic fetch shim at
      #      module top-level (SECURITY_SCAN_MOCK=1).
      #   2. security-scan-fetch-recorder.ts then wraps whatever
      #      globalThis.fetch currently points to — i.e. the mock's
      #      `patched` — so /_serverFn/* responses synthesized by the
      #      shim are still captured to SECURITY_SCAN_ARTIFACT_DIR.
      # Reversing the order would let the mock overwrite the recorder's
      # wrapper (tests re-import the mock, but the module-level install
      # only runs on first import — which is the preload), silently
      # producing an empty payload directory on failure.
      - name: Security scan RPC integration tests (mock)
        if: matrix.mode == 'mock'
        id: security_scan_tests_mock
        env:
          SECURITY_SCAN_MOCK: "1"
          SECURITY_SCAN_ARTIFACT_DIR: reports/security-scan/payloads
        run: |
          set -euo pipefail
          mkdir -p reports/security-scan
          bun test \
            --preload ./scripts/lib/security-scan-mock.ts \
            --preload ./scripts/lib/security-scan-fetch-recorder.ts \
            scripts/lib/security-scan-auth.test.ts \
            scripts/lib/security-scan-success.test.ts \
            scripts/lib/security-scan-decode.test.ts \
            scripts/lib/security-scan-grouping.test.ts \
            scripts/lib/security-scan-zero-alerts.test.ts \
            2>&1 | tee reports/security-scan/tests.log

      - name: Upload security-scan test logs and payloads (mock, on failure)
        if: matrix.mode == 'mock' && failure() && steps.security_scan_tests_mock.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-mock-failure-${{ github.run_id }}-${{ github.sha }}
          path: |
            reports/security-scan/tests.log
            reports/security-scan/payloads/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stop preview server (live)
        if: always() && matrix.mode == 'live' && steps.smoke_target.outputs.needs_local == 'true'
        run: |
          if [ -f /tmp/preview-server.pid ]; then
            kill "$(cat /tmp/preview-server.pid)" 2>/dev/null || true
          fi
          pkill -f workerd 2>/dev/null || true
          pkill -f wrangler 2>/dev/null || true
