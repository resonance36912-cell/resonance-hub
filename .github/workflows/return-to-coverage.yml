name: return_to coverage report

# Publishes the `return_to` fuzz/encoding coverage report (HTML + PDF) as
# workflow artifacts on every PR and every push to main, and writes a
# pass/fail summary into the job log and the run summary page.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write # post/update the sticky coverage comment on PR builds # needed to download the last successful run's summary.json baseline

jobs:
  report:
    name: return_to fuzz/encoding coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pulls summary.json (trend vs last run) and history.json (rolling
      # multi-run history for the charts) from the most recent SUCCESSFUL run of
      # this workflow
      # on main so the report can show a pass/fail trend and flag new failures.
      # Non-blocking: with no baseline the report says "first recorded run".
      # Baseline resolution, in order of preference:
      #   1. the stable-named `return-to-baseline` artifact, promoted by the most
      #      recent PASSING push to main (see the promote step below), or
      #   2. a scan of the last successful run of this workflow on main (legacy
      #      fallback for repos/PRs older than the first promotion).
      # Non-blocking: with no baseline the report says "first recorded run".
      - name: Download promoted baseline (last passing main run)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p reports/return-to-coverage/baseline
          # Newest non-expired artifact named exactly `return-to-baseline`.
          ART_ID="$(gh api --paginate \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "return-to-baseline" and .expired == false)] | sort_by(.created_at) | last | .id' 2>/dev/null || true)"
          if [ -z "${ART_ID:-}" ] || [ "$ART_ID" = "null" ]; then
            echo "No promoted baseline artifact yet — falling back to a run scan."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > /tmp/rt-baseline.zip || {
            echo "::warning::Could not download promoted baseline — falling back to a run scan."; exit 0; }
          rm -rf /tmp/rt-promoted && mkdir -p /tmp/rt-promoted
          unzip -o -q /tmp/rt-baseline.zip -d /tmp/rt-promoted || {
            echo "::warning::Promoted baseline archive unreadable — falling back to a run scan."; exit 0; }
          for f in summary.json history.json baseline.json; do
            SRC="$(find /tmp/rt-promoted -name "$f" -print -quit)"
            [ -n "$SRC" ] && cp "$SRC" "reports/return-to-coverage/baseline/$f" && echo "Promoted $f: $SRC"
          done
          if [ -f reports/return-to-coverage/baseline/baseline.json ]; then
            echo "Baseline metadata:"; cat reports/return-to-coverage/baseline/baseline.json
          fi

      - name: Fall back to last successful run when no promoted baseline exists
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p reports/return-to-coverage/baseline
          if [ -f reports/return-to-coverage/baseline/summary.json ]; then
            echo "Promoted baseline already in place — skipping the run scan."; exit 0
          fi
          RUN_ID="$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId' || true)"
          if [ -z "${RUN_ID:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "No previous successful run — no baseline."; exit 0
          fi
          echo "Baseline run: $RUN_ID"
          gh run download "$RUN_ID" --dir /tmp/rt-baseline || {
            echo "::warning::Baseline artifact unavailable (expired?) — skipping trend."; exit 0; }
          SRC="$(find /tmp/rt-baseline -name summary.json -print -quit)"
          if [ -n "$SRC" ]; then
            cp "$SRC" reports/return-to-coverage/baseline/summary.json
            echo "Baseline: $SRC"
          else
            echo "::warning::No summary.json in baseline artifact — skipping trend."
          fi
          HIST="$(find /tmp/rt-baseline -name history.json -print -quit)"
          if [ -n "$HIST" ]; then
            cp "$HIST" reports/return-to-coverage/baseline/history.json
            echo "History: $HIST"
          else
            echo "::warning::No history.json in baseline artifact — history restarts from this run."
          fi


      # Runs all five suites, prints the pass/fail table to the job log,
      # appends a markdown table to the run summary, and writes
      # reports/return-to-coverage/{return-to-coverage-report.html,summary.json}.
      # Exits non-zero on any failing test, so a redirect-safety regression
      # turns this job red.
      - name: Generate coverage report (HTML + job log summary)
        id: report
        run: bun run report:return-to-coverage

      # PDF rendering uses the Chrome that ships preinstalled on the
      # ubuntu-latest image. Non-blocking: if Chrome is unavailable the HTML
      # artifact is still published.
      - name: Render PDF from HTML
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          HTML=reports/return-to-coverage/return-to-coverage-report.html
          [ -f "$HTML" ] || { echo "No HTML report to render."; exit 0; }
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::No Chrome/Chromium on the runner — publishing HTML only."
            exit 0
          fi
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --print-to-pdf=reports/return-to-coverage/return-to-coverage-report.pdf \
            --no-pdf-header-footer "file://$PWD/$HTML"
          # One PDF per suite, next to its standalone HTML page.
          for f in reports/return-to-coverage/suites/*.html; do
            [ -f "$f" ] || continue
            "$CHROME" --headless=new --disable-gpu --no-sandbox \
              --print-to-pdf="${f%.html}.pdf" \
              --no-pdf-header-footer "file://$PWD/$f"
          done
          ls -l reports/return-to-coverage/ reports/return-to-coverage/suites/



      - name: Upload coverage report artifacts
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: return-to-coverage-${{ github.run_id }}-${{ github.sha }}
          path: |
            reports/return-to-coverage/return-to-coverage-report.html
            reports/return-to-coverage/return-to-coverage-report.pdf
            reports/return-to-coverage/summary.json
            reports/return-to-coverage/history.json
          if-no-files-found: warn
          retention-days: 30

      # Automatic baseline update: a GREEN push to main promotes its own
      # summary.json/history.json into the stable-named `return-to-baseline`
      # artifact, so the next PR compares against the most recent successful
      # main run. Failing, empty or non-main runs leave the baseline untouched.
      - name: Stage baseline promotion
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: promote
        run: bun run baseline:return-to-promote

      - name: Upload promoted baseline
        if: steps.promote.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: return-to-baseline
          path: reports/return-to-coverage/promote/*.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      # One artifact per suite (HTML + PDF + summary JSON) so a failing suite can
      # be downloaded and opened on its own instead of scrolling the combined
      # report. Suite ids come from SUITES in scripts/return-to-coverage-report.ts.
      # Exact stored inputs for any NEW FAILURE suite; the CI log and the HTML
      # report link straight into these files.
      - name: Upload counterexample inputs (new failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-to-counterexamples-${{ github.run_id }}
          path: reports/return-to-coverage/counterexamples/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload per-suite report — fuzz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-to-suite-fuzz-${{ github.run_id }}
          path: reports/return-to-coverage/suites/return-to-suite-fuzz.*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload per-suite report — normalization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-to-suite-normalization-${{ github.run_id }}
          path: reports/return-to-coverage/suites/return-to-suite-normalization.*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload per-suite report — encoding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-to-suite-encoding-${{ github.run_id }}
          path: reports/return-to-coverage/suites/return-to-suite-encoding.*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload per-suite report — audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-to-suite-audit-${{ github.run_id }}
          path: reports/return-to-coverage/suites/return-to-suite-audit.*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload per-suite report — targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-to-suite-targets-${{ github.run_id }}
          path: reports/return-to-coverage/suites/return-to-suite-targets.*
          if-no-files-found: warn
          retention-days: 30



      # Posts the pass/fail summary + report links as ONE sticky comment per PR:
      # the marker `<!-- return-to-coverage-report -->` in pr-comment.md is used
      # to find and edit the previous comment, so re-runs never spam the thread.
      # Runs even when the report step failed, so red builds still explain why.
      - name: Comment pass/fail summary on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- return-to-coverage-report -->';
            const path = 'reports/return-to-coverage/pr-comment.md';
            let body;
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8').trimEnd();
              const artifactUrl = ${{ toJSON(steps.upload.outputs.artifact-url) }};
              if (artifactUrl) {
                body += `\n- [Direct artifact download](${artifactUrl})`;
              }
            } else {
              body = [
                MARKER,
                '### return_to fuzz & encoding coverage — ❌ report not generated',
                '',
                'The coverage run failed before writing a summary. See the [job log]' +
                  `(${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              ].join('\n');
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated coverage comment ${existing.id}`);
            } else {
              const { data } = await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info(`Created coverage comment ${data.id}`);
            }
