name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily at 03:17 UTC — catches newly-disclosed CVEs in pinned deps.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  # SARIF artifact retention in days. Override by setting repo/org variable
  # SARIF_RETENTION_DAYS (GitHub caps user-set retention at 90 days).
  # Default: 14 days — long enough to triage a work week + weekend, short
  # enough to keep artifact storage bounded.
  SARIF_RETENTION_DAYS: ${{ vars.SARIF_RETENTION_DAYS || '14' }}

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Project security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run verify-security-invariants
        run: bun run scripts/verify-security-invariants.ts

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license required for public repos. For private repos add
          # GITLEAKS_LICENSE in repo secrets and uncomment:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  dependency-audit:
    name: Dependency audit (npm advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify pinned dependency versions
        # Fails if package.json uses range specifiers (^, ~, >=) or if
        # bun.lock resolved a different version than package.json declares.
        # Keeps fresh installs deterministic so security scans stay green.
        run: bun run scripts/verify-pinned-deps.ts
      - name: Install with frozen lockfile
        # --frozen-lockfile ensures CI installs exactly what's committed;
        # any drift between package.json and bun.lock fails the job.
        run: bun install --frozen-lockfile
      - name: bun audit (high+)
        # `bun audit` queries the npm advisory DB. Fail only on high/critical
        # so transient low-severity noise doesn't block PRs.
        run: bun audit --audit-level=high

  sast-semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: semgrep ci
        # Curated rulesets:
        #   p/owasp-top-ten, p/javascript, p/typescript, p/react,
        #   p/nodejsscan, p/secrets
        run: |
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejsscan \
            --config p/secrets \
            --error \
            --sarif --output=semgrep.sarif || true
      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Setup Bun (for SARIF summarizer)
        if: always()
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Summarize Semgrep findings to job summary
        # Parses semgrep.sarif and appends top rule IDs + file:line to
        # $GITHUB_STEP_SUMMARY so alerts are visible in the run log.
        if: always()
        run: bun run scripts/summarize-sarif.ts semgrep.sarif --label "Semgrep" --top 10
      - name: Upload Semgrep SARIF artifact (always)
        # Uploads SARIF on every run — success or failure — so alerts can be
        # triaged locally without needing the Security tab. Retention is
        # controlled by the SARIF_RETENTION_DAYS repo variable (default 14).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Artifact name includes the short SHA and workflow run ID so multiple
          # runs (e.g. re-runs, matrix retries) don't collide and each artifact
          # can be traced back to its exact commit + run.
          name: semgrep-sarif-${{ github.run_id }}-${{ github.sha }}
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: ${{ env.SARIF_RETENTION_DAYS }}

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: Analyze
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
      - name: Summarize CodeQL findings to job summary
        # Parses the SARIF that CodeQL just emitted and appends a compact
        # Markdown table (top rule IDs + locations) to $GITHUB_STEP_SUMMARY
        # so reviewers can triage the top alerts without downloading anything.
        if: always()
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Write CodeQL summary
        if: always()
        run: bun run scripts/summarize-sarif.ts codeql-results --label "CodeQL" --top 10
      - name: Upload CodeQL SARIF artifact (always)
        # Uploads SARIF on every run — success or failure — so alerts can be
        # triaged locally without needing the Security tab. Retention is
        # controlled by the SARIF_RETENTION_DAYS repo variable (default 14).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Artifact name includes the workflow run ID and commit SHA for easy
          # correlation across re-runs and branches.
          name: codeql-sarif-${{ github.run_id }}-${{ github.sha }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: ${{ env.SARIF_RETENTION_DAYS }}
