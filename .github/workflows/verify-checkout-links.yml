name: Verify commercial mode

on:
  pull_request:
  push:
    branches: [main, ronsas/ealiophin-production]
  merge_group:

jobs:
  verify:
    name: Commercial mode invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify active commercial mode
        run: bun run scripts/verify-commercial-mode.ts
