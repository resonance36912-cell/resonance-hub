name: Release

# Cut a new version from main:
#   1. Bump the [Unreleased] heading in CHANGELOG.md to [X.Y.Z] — YYYY-MM-DD
#   2. Insert a fresh empty [Unreleased] template
#   3. Commit, tag vX.Y.Z, push
#   4. Create a DRAFT GitHub Release whose body is the extracted changelog section
#
# Trigger manually from the Actions tab. The draft release is never auto-published
# so a human always reviews notes before shipping.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to release (no leading v, e.g. 0.2.0)"
        required: true
        type: string
      dry_run:
        description: "Preview only — do not commit, tag, or create release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # commit CHANGELOG bump, push tag, create release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate version input
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not valid semver (expected X.Y.Z or X.Y.Z-prerelease)"
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >>"$GITHUB_OUTPUT"

      - name: Extract [Unreleased] section and bump CHANGELOG.md
        id: changelog
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_DATE: ${{ steps.version.outputs.date }}
        run: |
          python3 <<'PY'
          import os, re, pathlib, sys, textwrap

          version = os.environ["NEW_VERSION"]
          date = os.environ["NEW_DATE"]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          pattern = re.compile(
              r"(##\s*\[Unreleased\][^\n]*\n)(.*?)(?=\n##\s*\[\d|\Z)",
              re.DOTALL,
          )
          m = pattern.search(text)
          if not m:
              print("::error::Could not find [Unreleased] section in CHANGELOG.md")
              sys.exit(1)

          unreleased_body = m.group(2).strip("\n")

          non_placeholder = re.sub(r"_Nothing yet\._", "", unreleased_body)
          non_placeholder = re.sub(r"<!--.*?-->", "", non_placeholder, flags=re.DOTALL)
          if not re.search(r"^\s*-\s+\S", non_placeholder, re.MULTILINE):
              print("::error::[Unreleased] has no real entries — nothing to release.")
              sys.exit(1)

          fresh_unreleased = textwrap.dedent("""\
              ## [Unreleased]

              Track upcoming work here before it ships. Move entries under a new dated
              version heading at release time and reset each subsection to
              `_Nothing yet._`.

              ### Added

              _Nothing yet._

              ### Changed

              _Nothing yet._

              ### Deprecated

              _Nothing yet._

              ### Removed

              _Nothing yet._

              ### Fixed

              _Nothing yet._

              ### Security

              _Nothing yet._

              """)

          new_heading = f"## [{version}] \u2014 {date}\n"
          replacement = fresh_unreleased + new_heading + unreleased_body.rstrip() + "\n"
          new_text = text[: m.start()] + replacement + text[m.end():]

          repo = os.environ.get("GITHUB_REPOSITORY", "resonance36912-cell/resonance-hub")
          new_text = re.sub(
              r"\[Unreleased\]:\s*https://github\.com/[^\s]+/compare/[^\s]+",
              f"[Unreleased]: https://github.com/{repo}/compare/v{version}...HEAD",
              new_text,
          )
          if re.search(r"^\[\d[^\]]*\]:\s*https://github\.com/", new_text, re.MULTILINE):
              new_link = f"[{version}]: https://github.com/{repo}/releases/tag/v{version}"
              if new_link not in new_text:
                  new_text = new_text.rstrip() + "\n" + new_link + "\n"

          path.write_text(new_text)

          notes_path = pathlib.Path("RELEASE_NOTES.md")
          notes_path.write_text(unreleased_body.strip() + "\n")
          print(f"Extracted {len(unreleased_body.splitlines())} lines of release notes.")
          PY

      - name: Show CHANGELOG diff
        run: git --no-pager diff CHANGELOG.md | head -200

      - name: Show extracted release notes
        run: cat RELEASE_NOTES.md

      - name: Stop here (dry run)
        if: inputs.dry_run == true
        run: |
          echo "Dry run complete — no commit, tag, or release created."
          exit 0

      - name: Commit CHANGELOG bump
        if: inputs.dry_run != true
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"
          git push origin main

      - name: Create and push tag
        if: inputs.dry_run != true
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create draft GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --target main
          echo "Draft release created: review and publish from the Releases tab."

      - name: Cleanup
        if: always()
        run: rm -f RELEASE_NOTES.md
