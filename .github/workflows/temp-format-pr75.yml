name: Temporary format PR75

on:
  push:
    branches:
      - ronsas/promotion-workload-main-20260922

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ronsas/promotion-workload-main-20260922
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Format only PR75 files
        run: bun x prettier --write scripts/lib/promotion-costing.test.ts src/lib/backend-provider.server.ts src/lib/costing-study.functions.ts src/lib/promotion-costing.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/promotion-costing.test.ts src/lib/backend-provider.server.ts src/lib/costing-study.functions.ts src/lib/promotion-costing.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: format promotion workload telemetry"
          git push origin HEAD:ronsas/promotion-workload-main-20260922
