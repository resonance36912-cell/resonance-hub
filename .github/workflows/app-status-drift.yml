name: App status drift watch

# Scheduled guard for the app-status badge vocabulary. Reads the live
# /api/public/app-status/health payload and compares every app's status, badge
# label, access line, and the legend wording against the committed baseline in
# baselines/app-status.json.
#
# Alerting:
#   - Slack: set the repo secret SLACK_WEBHOOK_URL (Slack Incoming Webhook).
#     Skipped automatically when the secret is absent.
#   - Email: GitHub emails the workflow's watchers whenever a scheduled run
#     fails, so a drift alert lands in your inbox with no extra setup. Tune it
#     under GitHub → Settings → Notifications → "Actions".
#
# Intentional change? Run `bun run baseline:app-status` and commit
# baselines/app-status.json in the same PR as the copy change.

on:
  schedule:
    # Daily at 04:10 UTC. PR path filters still catch source changes immediately.
    - cron: "10 4 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin to probe (defaults to the production Hub)"
        required: false
        default: "https://reson8.life"
  # Also run on PRs that touch the registry or its baseline, so a copy change
  # without a baseline promotion is caught before it merges.
  pull_request:
    paths:
      - "src/lib/app-registry.ts"
      - "src/lib/app-status-meaning.ts"
      - "src/routes/api/public/app-status.health.ts"
      - "baselines/app-status.json"
      - "scripts/check-app-status-drift.ts"
      - "scripts/lib/app-status-drift.ts"

permissions:
  contents: read

concurrency:
  group: app-status-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Compare live badge vocabulary against the baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Unit-test the drift comparison logic
        run: bun test scripts/lib/app-status-drift.test.ts

      - name: Check the live health endpoint against the baseline
        id: drift
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://reson8.life' }}
        run: bun run scripts/check-app-status-drift.ts

      - name: Upload the drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-status-drift-report
          path: drift-artifacts/app-status-alert.md
          if-no-files-found: ignore
          retention-days: 30

      # Slack alert. Uses the raw Incoming Webhook API so no third-party
      # action is required. Skipped when SLACK_WEBHOOK_URL is not configured.
      - name: Notify Slack on drift
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY_FILE=drift-artifacts/app-status-alert.md
          if [ -f "$BODY_FILE" ]; then
            TEXT=$(cat "$BODY_FILE")
          else
            TEXT="App status drift watch failed before it could produce a report."
          fi
          jq -n --arg text "$TEXT" --arg run "$RUN_URL" \
            '{text: ("🚨 Resonance Hub app status drift\n\n" + $text + "\n\nRun: " + $run)}' \
            > payload.json
          curl -sS -f -X POST -H 'Content-Type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL"
