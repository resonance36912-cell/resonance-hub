name: Outdated pinned dependencies

# Scheduled REPORT-ONLY audit of exact version pins.
#
# Every dependency here is pinned exactly (enforced by verify-pinned-deps.yml),
# so nothing ever updates by itself. This job asks the npm registry what the
# latest published version of each pin is and files a single issue containing a
# ready-to-apply update plan.
#
# It deliberately does NOT change package.json, bun.lock, or overrides, and does
# not open PRs — Dependabot (.github/dependabot.yml) handles proposing bumps.
# This is the human-readable overview: what's behind, grouped by risk, with the
# exact commands to apply and re-verify.
#
# The issue is reused: one open issue is updated in place per run, so scheduled
# runs never pile up duplicates.
#
# Slack: set the repo secret SLACK_WEBHOOK_URL (Slack Incoming Webhook) to get a
# message with the top outdated packages plus links to the plan issue and the
# run's report artifact. Without the secret the notify step is skipped.


# Cadence and thresholds are configurable with repository variables
# (Settings > Secrets and variables > Actions > Variables) — no code edit needed:
#
#   PINS_AUDIT_DAYS      cadence: comma list of UTC weekday numbers (0=Sun..6=Sat)
#                        or "*" for daily. Default "1" (Mondays).
#   PINS_AUDIT_HOUR      cadence: UTC hour to run on those days. Default "6".
#   PINS_MIN_BUMP        patch | minor | major — smallest severity that counts
#   PINS_IGNORE_BUMPS    bump kinds to drop (default "prerelease")
#   PINS_IGNORE          package names / globs to ignore, e.g. "@types/*,vite"
#   PINS_ONLY            when set, ONLY these names/globs are audited
#   PINS_MIN_OUTDATED    file the issue/PR only at N+ findings (default 1)
#   PINS_FAIL_ON_MAJOR   "true" to fail the run when a major is behind
#
# GitHub does not allow variables inside `cron`, so the schedule is hourly and
# the `cadence` job below decides whether this hour is a configured slot. Manual
# `workflow_dispatch` runs always proceed.


on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      skip_issue:
        description: "Only write the report artifact, do not touch the issue"
        type: boolean
        required: false
        default: false
      open_pr:
        description: "Also open/update the ready-to-merge update PR"
        type: boolean
        required: false
        default: true
      group:
        description: "Which pins to apply in the PR"
        type: choice
        required: false
        default: low-risk
        options: [low-risk, patch, minor]
  # Keep the checker itself honest when its own code changes.
  pull_request:
    paths:
      - "scripts/check-outdated-pins.ts"
      - "scripts/apply-outdated-pins.ts"
      - "scripts/lib/outdated-pins.ts"
      - "scripts/lib/outdated-pins.test.ts"
      - "scripts/lib/outdated-pins-config.ts"
      - "scripts/lib/outdated-pins-config.test.ts"
      - ".github/workflows/outdated-pins.yml"
  # Every push to main runs the pin-drift gate below, independent of cadence.
  push:
    branches: [main]


permissions:
  contents: read

concurrency:
  group: outdated-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Pin-drift gate — runs on EVERY trigger of this workflow (schedule,  #
  # manual dispatch, PR, push), before and independent of the cadence   #
  # gate. The scheduled audit only reports what upstream published; a   #
  # package.json <-> bun.lock mismatch is a repo defect that must fail  #
  # CI immediately, even in an hour when no scheduled audit runs.       #
  # ------------------------------------------------------------------ #
  pin-drift:
    name: Fail on package.json <-> bun.lock pin drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install the repository before loading Vitest so vite.config.ts can
      # resolve the app's pinned build plugins. A bare bunx vitest invocation
      # can otherwise fail during config loading before the audit test starts.
      - name: Install with the frozen lockfile
        run: bun install --frozen-lockfile

      # A bug in the audit core would turn this gate into a silent no-op that
      # passes on drifted pins, so its unit tests run after dependencies exist.
      - name: Test the pin-audit core
        run: bunx vitest run scripts/lib/pinned-deps.test.ts

      - name: Audit pins against bun.lock
        id: drift
        run: bun run scripts/verify-deps-pinned.ts

      - name: Explain the drift and how to resync
        if: failure()
        run: |
          {
            echo "## Dependency pin drift"
            echo
            echo "package.json and bun.lock disagree, or an entry is not pinned to an exact version."
            echo "The offending packages and their expected bun.lock versions are in the step log above."
            echo
            echo '```bash'
            echo "bun install                       # re-resolve bun.lock"
            echo "bun run scripts/verify-deps-pinned.ts   # confirm it is clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Turns PINS_AUDIT_DAYS / PINS_AUDIT_HOUR into a single run/skip decision, so
  # the cadence is a repo variable rather than a committed cron expression.
  cadence:
    name: Decide whether this hour is a scheduled slot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Evaluate the configured cadence
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          DAYS: ${{ vars.PINS_AUDIT_DAYS || '1' }}
          HOUR: ${{ vars.PINS_AUDIT_HOUR || '6' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT run — cadence gate does not apply."
            exit 0
          fi
          NOW_DAY=$(date -u +%w)
          NOW_HOUR=$(date -u +%-H)
          if [ "$NOW_HOUR" != "$HOUR" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Hour ${NOW_HOUR}Z is not the configured PINS_AUDIT_HOUR=${HOUR}Z — skipping."
            exit 0
          fi
          if [ "$DAYS" = "*" ] || echo ",$DAYS," | tr -d ' ' | grep -q ",$NOW_DAY,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Day $NOW_DAY at ${NOW_HOUR}Z matches PINS_AUDIT_DAYS=${DAYS} — running."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Day $NOW_DAY is not in PINS_AUDIT_DAYS=${DAYS} — skipping."
          fi

  audit:
    name: Report outdated pins and file an update plan
    # Gated on pin-drift: an update plan derived from a repo whose pins already
    # disagree with the lockfile would propose versions against a broken base.
    needs: [cadence, pin-drift]
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to create/update the plan issue. Not granted on pull_request runs
      # from forks, which is why the issue step is gated on the schedule below.
      issues: write
    outputs:
      outdated_count: ${{ steps.audit.outputs.outdated_count }}
      reportable: ${{ steps.audit.outputs.reportable }}
      issue_url: ${{ steps.issue.outputs.url }}
    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A bug in the comparison logic would silently report "all up to date",
      # so the unit tests gate the audit rather than trailing it.
      - name: Unit-test the outdated-pin logic
        run: bunx vitest run scripts/lib/outdated-pins.test.ts scripts/lib/outdated-pins-config.test.ts

      - name: Check pins against the npm registry (read-only)
        id: audit
        env:
          PINS_MIN_BUMP: ${{ vars.PINS_MIN_BUMP }}
          PINS_IGNORE_BUMPS: ${{ vars.PINS_IGNORE_BUMPS }}
          PINS_IGNORE: ${{ vars.PINS_IGNORE }}
          PINS_ONLY: ${{ vars.PINS_ONLY }}
          PINS_MIN_OUTDATED: ${{ vars.PINS_MIN_OUTDATED }}
          PINS_FAIL_ON_MAJOR: ${{ vars.PINS_FAIL_ON_MAJOR }}
        run: bun run scripts/check-outdated-pins.ts

      # Proof the audit mutated nothing. If a future change starts writing pins,
      # this fails instead of quietly rewriting the lockfile on a schedule.
      - name: Assert the repo is untouched
        run: |
          if [ -n "$(git status --porcelain -- package.json bun.lock)" ]; then
            echo "::error::check-outdated-pins.ts modified package.json or bun.lock — it must be report-only"
            git --no-pager diff -- package.json bun.lock
            exit 1
          fi
          echo "package.json and bun.lock are unchanged."

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-pins-report
          path: reports/outdated-pins.*
          if-no-files-found: error
          retention-days: 30

      - name: File or update the update-plan issue
        id: issue
        if: >-
          github.event_name != 'pull_request' && inputs.skip_issue != true
          && (steps.audit.outputs.reportable == 'true' || steps.audit.outputs.outdated_count == '0')
        env:
          GH_TOKEN: ${{ github.token }}
          OUTDATED_COUNT: ${{ steps.audit.outputs.outdated_count }}
          SUMMARY: ${{ steps.audit.outputs.summary }}
        run: |
          set -euo pipefail
          MARKER='<!-- reson8:outdated-pins -->'
          TITLE='Outdated pinned dependencies — update plan'
          BODY_FILE=reports/outdated-pins.md

          # Find our own issue by marker, so a human-titled issue is never hijacked.
          EXISTING=$(gh issue list --state open --limit 100 --json number,body \
            --jq "[.[] | select(.body != null and (.body | contains(\"$MARKER\")))] | .[0].number // empty")

          if [ "${OUTDATED_COUNT}" = "0" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "All pins are back at their latest published versions — closing this plan."
              gh issue close "$EXISTING"
              echo "Closed #$EXISTING: everything is up to date."
              echo "action=closed" >> "$GITHUB_OUTPUT"
              echo "url=$(gh issue view "$EXISTING" --json url --jq .url)" >> "$GITHUB_OUTPUT"
            else
              echo "Nothing outdated and no open plan issue. Done."
              echo "action=none" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            echo "Updated #$EXISTING — ${SUMMARY}"
            echo "action=updated" >> "$GITHUB_OUTPUT"
            echo "url=$(gh issue view "$EXISTING" --json url --jq .url)" >> "$GITHUB_OUTPUT"
          else
            # --label is best-effort: a repo without the label should still get the issue.
            URL=$(gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label dependencies \
              || gh issue create --title "$TITLE" --body-file "$BODY_FILE")
            echo "Opened $URL — ${SUMMARY}"
            echo "action=created" >> "$GITHUB_OUTPUT"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      # Slack alert. Raw Incoming Webhook (same shape as app-status-drift.yml),
      # skipped when SLACK_WEBHOOK_URL is not configured or no issue changed.
      - name: Notify Slack about the update plan
        if: >-
          always() && env.SLACK_WEBHOOK_URL != ''
          && (steps.issue.outputs.action == 'created'
              || steps.issue.outputs.action == 'updated'
              || steps.issue.outputs.action == 'closed')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          ISSUE_ACTION: ${{ steps.issue.outputs.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bun run scripts/slack-outdated-pins.ts
          curl -sS -f -X POST -H 'Content-Type: application/json' \
            --data @reports/outdated-pins.slack.json "$SLACK_WEBHOOK_URL"


  # ------------------------------------------------------------------ #
  # Ready-to-merge update PR.                                          #
  #                                                                    #
  # Applies ONLY the selected group's pins (default: patch + minor) by  #
  # exact-match rewrite, re-resolves bun.lock, and runs the full        #
  # prebuild gate before pushing — so the PR arrives already verified.  #
  # Majors are excluded on purpose: they get hand-reviewed PRs.         #
  #                                                                    #
  # The branch name is derived from the plan, so a rerun with the same  #
  # findings force-updates one PR instead of opening a new one.         #
  # ------------------------------------------------------------------ #
  update-pr:
    name: Open or update the pinned-dependency PR
    needs: audit
    if: >-
      github.event_name != 'pull_request'
      && needs.audit.outputs.reportable == 'true'
      && (github.event_name == 'schedule' || inputs.open_pr != false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Reuse the audit's findings verbatim so the PR can never claim a version
      # the report never saw.
      - name: Download the audit report
        uses: actions/download-artifact@v4
        with:
          name: outdated-pins-report
          path: reports

      - name: Apply the planned pins and verify
        id: apply
        env:
          GROUP: ${{ inputs.group || 'low-risk' }}
          ISSUE_URL: ${{ needs.audit.outputs.issue_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun run deps:apply

      - name: Push the branch and open or update the PR
        if: steps.apply.outputs.applied != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.apply.outputs.branch }}
          TITLE: ${{ steps.apply.outputs.title }}
          BODY_FILE: ${{ steps.apply.outputs.body_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # package.json and bun.lock in ONE commit — prebuild's frozen install
          # fails the moment they disagree.
          git checkout -B "$BRANCH"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No pin changes staged after verification; nothing to push."
            exit 0
          fi
          git commit -m "$TITLE" -m "Applied from the scheduled outdated-pin audit. Verified with bun run prebuild."
          git push --force-with-lease origin "$BRANCH"

          if EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty') \
             && [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            echo "Updated PR #$EXISTING"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "$TITLE" --body-file "$BODY_FILE" --label dependencies \
              || gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
                --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Upload the PR plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outdated-pins-pr
          path: reports/outdated-pins-pr.*
          if-no-files-found: ignore
          retention-days: 30
