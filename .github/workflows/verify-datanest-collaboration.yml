name: Verify DataNest collaboration

on:
  pull_request:
    branches: [ronsas/ealiophin-production]
    paths:
      - "src/lib/datanest/collaboration.*"
      - "src/routes/datanest*"
      - "src/components/datanest/**"
      - "scripts/lib/datanest-collaboration-*.test.ts"
      - "supabase/migrations/*_datanest_collaboration_core.sql"
      - ".github/workflows/verify-datanest-collaboration.yml"

permissions:
  contents: read

concurrency:
  group: datanest-collaboration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: DataNest collaboration focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run schema contract
        id: schema
        continue-on-error: true
        run: bun test scripts/lib/datanest-collaboration-schema.test.ts

      - name: Generate canonical migration name after expected RED
        if: steps.schema.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          bunx supabase --version
          bunx supabase migration new datanest_collaboration_core
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_datanest_collaboration_core.sql' -printf '%f\n' | sort | tail -1)"
          test -n "$generated"
          echo "DATANEST_GENERATED_MIGRATION=$generated"
          echo "DATANEST_GENERATED_MIGRATION=$generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve RED as a failing check
        if: steps.schema.outcome == 'failure'
        run: exit 1

      - name: Confirm schema contract passed
        if: steps.schema.outcome == 'success'
        run: echo "DATANEST_SCHEMA_GREEN=1"

      - name: Run collaboration API contract
        id: functions
        continue-on-error: true
        run: bun test scripts/lib/datanest-collaboration-functions.test.ts

      - name: Preserve API RED as a failing check
        if: steps.functions.outcome == 'failure'
        run: exit 1

      - name: Confirm API contract passed
        if: steps.functions.outcome == 'success'
        run: echo "DATANEST_API_GREEN=1"

      - name: Run collaboration UI contract
        id: ui
        continue-on-error: true
        run: bun test scripts/lib/datanest-collaboration-ui.test.ts

      - name: Preserve UI RED as a failing check
        if: steps.ui.outcome == 'failure'
        run: exit 1

      - name: Confirm UI contract passed
        if: steps.ui.outcome == 'success'
        run: echo "DATANEST_UI_GREEN=1"

      - name: Run repository test suite
        if: steps.schema.outcome == 'success' && steps.functions.outcome == 'success' && steps.ui.outcome == 'success'
        run: bun run test

      - name: Typecheck candidate
        if: steps.schema.outcome == 'success' && steps.functions.outcome == 'success' && steps.ui.outcome == 'success'
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_PUBLISHABLE_KEY: "ci-datanest-not-a-secret"
          VITE_SUPABASE_URL: "http://127.0.0.1:54321"
          VITE_SUPABASE_PUBLISHABLE_KEY: "ci-datanest-not-a-secret"
        run: bun run typecheck

      - name: Verify security invariants
        if: steps.schema.outcome == 'success' && steps.functions.outcome == 'success' && steps.ui.outcome == 'success'
        run: bun run verify:security

      - name: Audit dependencies
        if: steps.schema.outcome == 'success' && steps.functions.outcome == 'success' && steps.ui.outcome == 'success'
        run: bun audit --audit-level=high

      - name: Build production bundle
        if: steps.schema.outcome == 'success' && steps.functions.outcome == 'success' && steps.ui.outcome == 'success'
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_PUBLISHABLE_KEY: "ci-datanest-not-a-secret"
          VITE_SUPABASE_URL: "http://127.0.0.1:54321"
          VITE_SUPABASE_PUBLISHABLE_KEY: "ci-datanest-not-a-secret"
        run: bun run build
