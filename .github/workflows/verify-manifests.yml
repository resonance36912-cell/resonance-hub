name: Verify Manifest Integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-manifests:
    name: Tests must not mutate package.json / bun.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run test suite under the manifest guard
        run: bun run verify:manifests

      - name: Fail if git sees manifest drift
        run: |
          if ! git diff --quiet -- package.json bun.lock; then
            echo "::error::package.json or bun.lock was modified while running tests."
            git --no-pager diff -- package.json bun.lock
            exit 1
          fi
          echo "package.json and bun.lock are unchanged."
