name: RONSAS formatter self-heal

on:
  workflow_dispatch:
    inputs:
      failed_sha:
        description: Exact failed main SHA eligible for formatter-only repair
        required: true
        type: string
      source_run_url:
        description: Source Verify prebuild run URL
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ronsas-format-autofix-${{ inputs.failed_sha }}
  cancel-in-progress: false

jobs:
  format-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 2

      - name: Verify dispatched SHA is still current main
        id: trust
        env:
          EXPECTED_SHA: ${{ inputs.failed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Current main $current_sha no longer matches failed SHA $EXPECTED_SHA; refusing stale repair."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Bun
        if: steps.trust.outputs.current == 'true'
        id: setup_bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - name: Retry pinned Bun setup
        if: steps.trust.outputs.current == 'true' && steps.setup_bun.outcome == 'failure'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.3"

      - name: Apply formatter only to files changed by current main commit
        if: steps.trust.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMRTUXB HEAD^ HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yml' '*.yaml' | grep -Ev '^(dist|\.output|\.vinxi|src/routeTree\.gen\.ts)' || true)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No formatter-eligible changed files."
            exit 0
          fi
          printf 'Formatter-only repair candidates:\n'
          printf '  %s\n' "${CHANGED[@]}"
          bunx prettier --write "${CHANGED[@]}"

      - name: Publish bounded formatter repair PR
        if: steps.trust.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.failed_sha }}
          SOURCE_RUN_URL: ${{ inputs.source_run_url }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter produced no changes; no repair PR required."
            exit 0
          fi

          repair_branch="ronsas/ci-autofix-format-${GITHUB_RUN_ID}"
          git config user.name "RONSAS CI recovery"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$repair_branch"
          git add -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yml' '*.yaml'
          git commit -m "style: auto-repair formatting after CI failure"
          git push origin "$repair_branch"

          gh pr create --repo "$REPO" --base main --head "$repair_branch" \
            --title "style: RONSAS CI formatting self-heal" \
            --body "Automated bounded formatter-only repair for failed Verify prebuild run ${SOURCE_RUN_URL}. Source main SHA: \`${EXPECTED_SHA}\`. The dispatcher verified that this exact SHA was current main before this workflow started; this workflow reverified it after checking out literal main. No semantic autofix is attempted."
