name: Security hardening suggestion (non-sensitive)
description: Suggest a non-sensitive security improvement (defense-in-depth, doc fix, hardening idea). For active vulnerabilities use the private advisory link instead.
title: "[security]: "
labels: ["security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        > **STOP** — if you can exploit this to access data, funds, or another user's account, **do not open a public issue**.
        > Report it privately: https://github.com/resonance36912-cell/resonance-hub/security/advisories/new
        >
        > Use this template only for *non-sensitive* hardening ideas (e.g. "consider adding a CSP header", "docs recommend a weak pattern").
  - type: checkboxes
    id: confirm
    attributes:
      label: Disclosure confirmation
      options:
        - label: This is NOT an exploitable vulnerability. If it is, I will close this and file a private advisory instead.
          required: true
        - label: I have not included working exploit payloads, victim data, or credentials.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What's the hardening opportunity?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - RLS / database policies
        - Auth / session handling
        - PayFast ITN / webhook verification
        - Public API routes
        - Admin routes
        - MCP server
        - CI / supply chain (Dependabot, pinning, SARIF)
        - Secrets handling
        - Headers / CSP / cookies
        - Docs recommending a weak pattern
        - Other
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Potential impact if unaddressed
      description: What could go wrong in the worst case? Keep it abstract.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommended change
      description: Concrete file / route / config change you'd propose.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: OWASP, CWE, provider docs, RCGF section, etc.
