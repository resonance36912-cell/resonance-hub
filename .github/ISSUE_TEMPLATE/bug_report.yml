name: Bug report
description: Report a defect in the Resonance Hub (billing, entitlements, ROP, admin, MCP, or public routes).
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill out every section — issues missing reproduction steps or environment info will be closed as `needs-info`.
        **Do not paste secrets, PayFast keys, ITN payloads with PII, or Supabase service-role tokens.**
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the bug.
      placeholder: "Refreshing /account/subscriptions bounces signed-in users to /"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Billing / PayFast ITN
        - Entitlements / subscriptions
        - Credits / ledger
        - Invoices / receipts
        - ROP telemetry
        - Admin dashboards
        - Auth / RLS
        - MCP server
        - Public API (/api/public/*)
        - Governance / RCGF pages
        - Pricing / checkout
        - CI / workflows
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from a known state (signed out, fresh session, specific route).
      placeholder: |
        1. Sign in as a Studio Pass subscriber
        2. Visit /account/subscriptions
        3. Hard-refresh (Cmd+Shift+R)
        4. Observe redirect to /
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include screenshots, console errors, network status codes, or server-function logs. Redact PII.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL where the bug occurred
      placeholder: "https://reson8.life/account/subscriptions"
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser + OS + whether preview, published, or custom domain.
      placeholder: "Chrome 130 / macOS 15 / www.reson8.life"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / request IDs
      description: Server-function log request IDs, PayFast `pf_payment_id` (no signature), or CI run URL. Redact tokens.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is NOT a security vulnerability (if it is, use the private advisory link instead).
          required: true
        - label: I have redacted secrets, tokens, and PII from the report.
          required: true
