[auth]
site_url = "https://reson8.life"
additional_redirect_urls = [
  "https://reson8.life/**",
  "https://www.reson8.life/**",
  "http://localhost:3000/**",
  "http://localhost:5173/**",
  "http://localhost:8080/**",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:5173/**",
  "http://127.0.0.1:8080/**",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
